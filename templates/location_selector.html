<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MINORE BARBERSHOP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #1d1a1c;
      color: #fbcc93;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .wrap {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .logo {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 3px;
      margin-bottom: 0.4rem;
    }
    .tagline {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 2.5rem;
    }
    .label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #666;
      margin-bottom: 0.75rem;
    }
    .locations {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .loc-btn {
      display: block;
      padding: 1.1rem 1.5rem;
      background: #2a2a2a;
      border: 1.5px solid #333;
      border-radius: 10px;
      color: #fbcc93;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      transition: border-color 0.15s, background 0.15s;
    }
    .loc-btn:hover { border-color: #fbcc93; background: #333; }
    .loc-btn .addr {
      display: block;
      font-size: 0.8rem;
      font-weight: 400;
      color: #888;
      margin-top: 0.2rem;
    }
    .footer {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">MINORE</div>
    <div class="tagline">BARBERSHOP</div>
    <div class="label">Choose your location</div>
    <div class="locations">
      <a href="/client/book/mallorca" class="loc-btn">
        Mallorca
        <span class="addr">Carrer de Mallorca 233</span>
      </a>
      <a href="/client/book/concell" class="loc-btn">
        Consell
        <span class="addr">Consell de Cent 250</span>
      </a>
    </div>
    <div class="footer">Same-day appointments · Walk-ins welcome</div>
  </div>
</body>
</html>
