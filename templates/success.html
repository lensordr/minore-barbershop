{% extends "base.html" %}

{% block title %}Confirmed - MINORE BARBER{% endblock %}

{% block content %}
<div class="success-wrap">
  <div class="success-icon">✓</div>
  <h2>You're booked!</h2>
  <p>Your appointment at MINORE BARBER — {{ location }} is confirmed.</p>
  <p class="success-hint">Arrive 5 minutes early. Check your email for details.</p>
  <div class="success-actions">
    <a href="/client/dashboard" class="btn btn-primary">My appointments</a>
    <a href="/locations" class="btn btn-secondary">Book another</a>
  </div>
</div>

<style>
.success-wrap {
  max-width: 400px;
  margin: 3rem auto;
  text-align: center;
  padding: 2rem 1.5rem;
  background: #2a2a2a;
  border-radius: 12px;
  border: 1px solid #333;
}
.success-icon {
  font-size: 3.5rem;
  color: #fbcc93;
  margin-bottom: 0.75rem;
  animation: pop 0.5s ease-out;
}
@keyframes pop {
  0%   { transform: scale(0.5); opacity: 0; }
  80%  { transform: scale(1.1); }
  100% { transform: scale(1);   opacity: 1; }
}
.success-wrap h2 { color: #fbcc93; margin-bottom: 0.5rem; font-size: 1.4rem; }
.success-wrap p  { color: #aaa; font-size: 0.9rem; margin-bottom: 0.4rem; }
.success-hint    { color: #666 !important; font-size: 0.82rem !important; }
.success-actions {
  display: flex;
  gap: 0.75rem;
  justify-content: center;
  margin-top: 1.75rem;
}
.success-actions .btn { flex: 1; max-width: 180px; text-align: center; }
</style>
{% endblock %}
